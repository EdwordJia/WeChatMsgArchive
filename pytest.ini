[pytest]
# pytest 配置文件

# 测试目录
testpaths = tests

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=wxManager
    --cov=mcp_servers
    --cov-report=term-missing
    --cov-report=html:htmlcov

# 标记定义
markers =
    integration: 集成测试（需要真实数据）
    slow: 慢速测试
    unit: 单元测试

# 覆盖率配置
[coverage:run]
source =
    wxManager
    mcp_servers
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
